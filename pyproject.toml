[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "docugosync"
version = "0.1.0"
description = "AI-powered code-to-documentation synchronization"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
